name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon


  check-release:
    needs: build
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new changelog version
        id: changelog
        shell: bash
        run: |
          VERSION=$(grep '^## v' CHANGES.md | head -1 | sed 's/## //')

          if git tag | grep -q "^$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi


      - name: Create PR
        if: steps.changelog.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Release ${{ steps.changelog.outputs.version }}"
          body: |
            Automated release PR.

            Version:
            ${{ steps.changelog.outputs.version }}

            Changelog:
            ```md
            $(awk '/^## ${{ steps.changelog.outputs.version }}/,/^## /' CHANGES.md)
            ```

            Diff:
            ```diff
            $(git diff $(git describe --tags --abbrev=0)..HEAD)
            ```

          branch: release/${{ steps.changelog.outputs.version }}
          base: ${{ github.event.repository.default_branch }}


  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle


      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon


      - name: Generate release notes
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          awk -v tag="$TAG" '
          $0 ~ "^## "tag"$" {flag=1; next}
          /^## / && flag {exit}
          flag {print}
          ' CHANGES.md > RELEASE.md


          echo "" >> RELEASE.md
          echo "## Changes" >> RELEASE.md
          echo "" >> RELEASE.md

          if [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$TAG" >> RELEASE.md
          else
            git diff "$TAG^" "$TAG" >> RELEASE.md
          fi


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE.md
          files: |
            build/libs/*.jar