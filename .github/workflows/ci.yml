name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon


  check-release:
    needs: build
    if: |
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Check changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(grep -E '^## ?(\[)?[0-9]+\.[0-9]+\.[0-9]+' CHANGES.md \
            | head -1 \
            | sed -E 's/^## ?\[?([^]]+)\]?.*/\1/' \
            || true)

          if [ -z "$VERSION" ]; then
            echo "No version found"
            echo "release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="v$VERSION"

          if git tag --list | grep -qx "$TAG"; then
            echo "Tag exists: $TAG"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi


      - name: Create Draft PR
        if: steps.changelog.outputs.release == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Release ${{ steps.changelog.outputs.version }}"
          draft: true
          body: |
            Automated release PR.

            Version:
            ${{ steps.changelog.outputs.version }}

            Changelog:

            ```md
            ## ${{ steps.changelog.outputs.version }}
            $(awk '/^## ${{ steps.changelog.outputs.version }}/,/^## /' CHANGES.md)
            ```

          branch: release/${{ steps.changelog.outputs.version }}
          base: ${{ github.event.repository.default_branch }}


  create-tag:
    needs: build
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^## ?(\[)?[0-9]+\.[0-9]+\.[0-9]+' CHANGES.md \
            | head -1 \
            | sed -E 's/^## ?\[?([^]]+)\]?.*/\1/' \
            || true)

          if [ -z "$VERSION" ]; then
            echo "No version found"
            exit 0
          fi

          TAG="v$VERSION"

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git tag --list | grep -qx "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi


      - name: Create tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag ${{ steps.version.outputs.tag }}

          git push origin ${{ steps.version.outputs.tag }}