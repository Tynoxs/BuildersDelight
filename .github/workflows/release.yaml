name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon

  create-tag:
    needs: build
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^#{2,3} ?v?[0-9]+\.[0-9]+(\.[0-9]+)?' CHANGES.md \
            | head -1 \
            | sed -E 's/^#+ ?//' \
            | sed 's/^/v/' \
            || true)

          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGES.md"
            exit 1
          fi

          echo "Detected version: $VERSION"

          if git tag | grep -q "^$VERSION$"; then
            echo "Tag already exists: $VERSION"
            exit 1
          fi

          echo "tag=$VERSION" >> $GITHUB_OUTPUT


      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.version.outputs.tag }}

          git push origin ${{ steps.version.outputs.tag }}


  check-release:
    needs: build
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new changelog version
        id: changelog
        shell: bash
        run: |
            if [ ! -f CHANGES.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            exit 0
            fi

            VERSION=$(grep '^## v' CHANGES.md | head -1 | sed 's/## //' || true)

            if [ -z "$VERSION" ]; then
            echo "No version found in CHANGES.md"
            echo "exists=true" >> $GITHUB_OUTPUT
            exit 0
            fi

            echo "Detected version: $VERSION"

            if git tag | grep -q "^$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            fi


      - name: Create PR
        if: steps.changelog.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Release ${{ steps.changelog.outputs.version }}"
          draft: true
          body: |
            Automated release PR.

            Version:
            ${{ steps.changelog.outputs.version }}

            Changelog:
            ```md
            $(awk '/^## ${{ steps.changelog.outputs.version }}/,/^## /' CHANGES.md)
            ```

            Diff:
            ```diff
            $(git diff $(git describe --tags --abbrev=0)..HEAD)
            ```

          branch: release/${{ steps.changelog.outputs.version }}
          base: ${{ github.event.repository.default_branch }}


  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle


      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon


      - name: Generate release notes
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          awk -v tag="$TAG" '
          $0 ~ "^## "tag"$" {flag=1; next}
          /^## / && flag {exit}
          flag {print}
          ' CHANGES.md > RELEASE.md


          echo "" >> RELEASE.md
          echo "## Changes" >> RELEASE.md
          echo "" >> RELEASE.md

          if [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$TAG" >> RELEASE.md
          else
            git diff "$TAG^" "$TAG" >> RELEASE.md
          fi


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: true
          files: |
            build/libs/*.jar