name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string


permissions:
  contents: write


jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}


      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: build/libs


      - name: Generate release notes
        shell: bash
        run: |
          VERSION=${{ inputs.tag }}
          VERSION=${VERSION#v}

          awk -v tag="$VERSION" '
          $0 ~ "^## "tag"$" {flag=1; next}
          /^## / && flag {exit}
          flag {print}
          ' CHANGES.md > RELEASE.md


      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "${{ inputs.tag }} release"
          draft: true
          body_path: RELEASE.md
          files: |
            build/libs/*.jar